<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendito Cross - Carrito de Compras</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/tienda.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav_logo">
                <a href="index.html">
                    <span>Bendito Cross</span>
                    <span><p>Funcional Gym</p></span>
                </a>
            </div>
            <div class="nav_items" id="_items">
                <a href="index.html">INICIO</a>
                <a href="rm.html">% RM</a>
                <a href="fortime.html">FOR TIME</a>
                <a href="ejercicios.html">AYUDAS TRAINING</a>
                <a href="musculacion.html">MUSCULACIÓN</a>
                <a href="horarios.html">HORARIOS</a>
                <a href="diccionario.html">DICCIONARIO</a>
                <a href="tienda.html">TIENDA</a>
            </div>
            <div class="nav_toggle" id="_toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Bendito Cross Store</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <a class="boton-menu" href="tienda.html">
                            <i class="bi bi-arrow-return-left"></i> Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2025 Bendito Cross</p>
            </footer>
        </aside>
        
        <main>
            <h2 class="titulo-principal">Carrito de Compras</h2>
            
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-frown"></i></p>

                <div id="carrito-productos" class="carrito-productos disabled">
                    <!-- Los productos del carrito se cargarán dinámicamente aquí -->
                </div>

                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-acciones-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total: $<span id="total">0</span></p>
                        </div>
                        <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                    </div>
                </div>

                <p id="carrito-comprado" class="carrito-comprado disabled">
                    Muchas gracias por tu compra. <i class="bi bi-emoji-laughing"></i>
                </p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="script.js"></script>
</body>
</html>
