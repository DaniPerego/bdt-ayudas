<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Caché - Bendito Cross</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }
        .info {
            background: #e3f2fd;
            border: 2px solid #2196F3;
            color: #0d47a1;
        }
        .success {
            background: #c8e6c9;
            border: 2px solid #4CAF50;
            color: #1b5e20;
        }
        .error {
            background: #ffcdd2;
            border: 2px solid #f44336;
            color: #b71c1c;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-clear {
            background: #f44336;
            color: white;
        }
        .btn-clear:hover {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }
        .btn-verify {
            background: #4CAF50;
            color: white;
        }
        .btn-verify:hover {
            background: #388E3C;
        }
        .btn-goto {
            background: #2196F3;
            color: white;
        }
        .btn-goto:hover {
            background: #1976D2;
        }
        .icon {
            font-size: 48px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ Actualización del Sistema de Ejercicios</h1>
        
        <div class="status info" id="status">
            <div class="icon">📦</div>
            <p>El sistema se ha actualizado con <strong>873 ejercicios nuevos</strong>.</p>
            <p>Para verlos, necesitas limpiar el caché del navegador.</p>
        </div>

        <button class="btn-clear" onclick="limpiarCache()">
            🗑️ Limpiar Caché y Ver 873 Ejercicios
        </button>

        <button class="btn-verify" onclick="verificarCache()">
            🔍 Verificar Estado del Caché
        </button>

        <button class="btn-goto" onclick="irAMusculacion()">
            ➡️ Ir a Musculación
        </button>

        <div id="resultado"></div>
    </div>

    <script>
        function limpiarCache() {
            const statusDiv = document.getElementById('status');
            const resultadoDiv = document.getElementById('resultado');
            
            try {
                // Limpiar localStorage
                localStorage.removeItem('ejercicios-cache');
                
                // Limpiar sessionStorage también
                sessionStorage.clear();
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <div class="icon">✅</div>
                    <p><strong>¡Caché limpiado exitosamente!</strong></p>
                    <p>Ahora verás los <strong>873 ejercicios</strong> cuando vayas a la sección de Musculación.</p>
                `;
                
                resultadoDiv.innerHTML = `
                    <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px; color: #856404;">
                        <strong>📌 Siguiente paso:</strong><br>
                        Haz clic en "Ir a Musculación" para ver todos los ejercicios nuevos.
                    </div>
                `;
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <div class="icon">❌</div>
                    <p><strong>Error al limpiar caché:</strong></p>
                    <p>${error.message}</p>
                `;
            }
        }

        function verificarCache() {
            const resultadoDiv = document.getElementById('resultado');
            const cache = localStorage.getItem('ejercicios-cache');
            
            if (!cache) {
                resultadoDiv.innerHTML = `
                    <div class="status success">
                        <div class="icon">✅</div>
                        <p><strong>No hay caché guardado</strong></p>
                        <p>Estás listo para cargar los 873 ejercicios nuevos.</p>
                    </div>
                `;
            } else {
                try {
                    const data = JSON.parse(cache);
                    const cantidadEjercicios = data.ejercicios ? data.ejercicios.length : 'desconocida';
                    const version = data.version || 'sin versión';
                    const fecha = new Date(data.timestamp).toLocaleString('es-ES');
                    
                    resultadoDiv.innerHTML = `
                        <div class="status info">
                            <div class="icon">📊</div>
                            <p><strong>Estado del Caché:</strong></p>
                            <ul style="text-align: left; display: inline-block;">
                                <li>Ejercicios en caché: ${cantidadEjercicios}</li>
                                <li>Versión: ${version}</li>
                                <li>Fecha: ${fecha}</li>
                            </ul>
                            ${cantidadEjercicios < 800 ? '<p style="color: #d32f2f;"><strong>⚠️ Caché antiguo detectado. Haz clic en "Limpiar Caché".</strong></p>' : ''}
                        </div>
                    `;
                } catch (error) {
                    resultadoDiv.innerHTML = `
                        <div class="status error">
                            <div class="icon">⚠️</div>
                            <p><strong>Caché corrupto</strong></p>
                            <p>Haz clic en "Limpiar Caché" para solucionarlo.</p>
                        </div>
                    `;
                }
            }
        }

        function irAMusculacion() {
            window.location.href = 'musculacion.html';
        }

        // Verificar automáticamente al cargar la página
        window.onload = function() {
            verificarCache();
        };
    </script>
</body>
</html>
